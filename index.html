<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Финансовый помощник</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="container">
		<section id="navbar" class="auth-mode">
			<h1 id="navbar-title">Финансовый помощник</h1>
			<div id="navbar-user" style="display: none;">
				<span id="navbar-username"></span>
				<button id="user_settings-btn">настройки</button>
				<button id="user_logout-btn">выйти</button>
			</div>
		</section>

		<section id="auth-screen">
			<div id="auth-control">
				<button id="auth-login-btn">Вход</button>
				<button id="auth-register-btn">Регистрация</button>
			</div>

			<div id="login-form">
				<input type="text" id="login-username" placeholder="Логин">
				<input type="password" id="login-password" placeholder="Пароль">
				<button id="login-btn">Войти</button>
			</div>

			<div id="register-form" style="display: none;">
				<input type="text" id="register-username" placeholder="Логин">
				<input type="password" id="register-password" placeholder="Пароль">
				<input type="text" id="register-name" placeholder="Имя">
				<button id="register-btn">Зарегистрироваться</button>
			</div>

			<p id="auth-message"></p>
		</section>

		<section id="main-screen" style="display: none;">
			<h2>Главная страница</h2>
			<p>Добро пожаловать, <span id="display-username"></span>!</p>
		</section>
	</div>

	<script type="module" src="app.js"></script>
</body>
</html>
