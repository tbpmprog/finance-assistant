<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Финансовый помощник</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="container">
		<section id="navbar" class="auth-mode">
			<h1 id="navbar-title">Финансовый помощник</h1>
			<div id="navbar-user" style="display: none;">
				<span id="navbar-username"></span>
				<button id="user_settings-btn">настройки</button>
				<button id="user_logout-btn">выйти</button>
			</div>
		</section>

		<section id="auth-screen">
			<div id="auth-control">
				<button id="auth-login-btn" type="button">Вход</button>
				<button id="auth-register-btn" type="button">Регистрация</button>
			</div>

			<form id="login-form" class="auth-form">
				<label for="login-username" class="visually-hidden">Логин:</label>
				<input type="text" id="login-username" name="login" placeholder="Логин" required>
				
				<label for="login-password" class="visually-hidden">Пароль:</label>
				<input type="password" id="login-password" name="password" placeholder="Пароль" required>
				
				<label id="stay-label">
					<input type="checkbox" id="stay-logged"> Оставаться в системе
				</label>
				
				<button id="login-btn" type="submit">Войти</button>
			</form>

			<form id="register-form" class="auth-form" style="display: none;">
				<label for="register-username" class="visually-hidden">Логин:</label>
				<input type="text" id="register-username" name="login" placeholder="Логин" required>
				
				<label for="register-password" class="visually-hidden">Пароль:</label>
				<input type="password" id="register-password" name="password" placeholder="Пароль" required>
				
				<label for="register-name" class="visually-hidden">Имя:</label>
				<input type="text" id="register-name" name="name" placeholder="Имя" required>
				
				<button id="register-btn" type="submit">Зарегистрироваться</button>
			</form>

			<p id="auth-message"></p>
		</section>

		<section id="main-screen" style="display: none;">
			<p id="main-title"></p>
		</section>
	</div>
	<script type="module" src="app.js"></script>
</body>
</html>
